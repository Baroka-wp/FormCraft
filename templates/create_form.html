<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un formulaire - FormCraft</title>
    <style>
        /* File: create_form.html */
        /* Purpose: Interface style japonais pour création de formulaires */
        /* Design: Couleurs japonaises douces, cohérent avec l'app */
        
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            /* Style japonais - couleurs douces et naturelles */
            --bg-primary: #faf9f7;
            --bg-secondary: #f5f3f0;
            --bg-card: rgba(255, 255, 255, 0.8);
            --accent-primary: #2d5016;        /* Vert matcha foncé */
            --accent-secondary: #e91e63;      /* Rose sakura */
            --accent-gradient: linear-gradient(135deg, #4a7c59, #e91e63);
            --text-primary: #2c2c2c;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: rgba(45, 80, 22, 0.1);
            --success-color: #4a7c59;         /* Vert bambou */
            --danger-color: #d32f2f;
            --warning-color: #ff9800;
            --shadow-glow: 0 0 20px rgba(74, 124, 89, 0.2);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.1);
            --matcha-light: #8bc34a;          /* Vert matcha clair */
            --sakura-light: #fce4ec;          /* Rose sakura clair */
            --cream: #fff8e1;                 /* Crème */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(74, 124, 89, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(233, 30, 99, 0.05) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(74, 124, 89, 0.3)); }
            to { filter: drop-shadow(0 0 15px rgba(233, 30, 99, 0.3)); }
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: var(--sakura-light);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .form-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
        }

        .form-section {
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--accent-primary);
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 50px;
            height: 2px;
            background: var(--accent-secondary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.1);
            background: var(--cream);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-muted);
        }

        /* Dynamic fields */
        .fields-container {
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            background: var(--bg-secondary);
        }

        .field-item {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .field-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-card);
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr 120px 80px 40px;
            gap: 1rem;
            align-items: end;
        }

        .required-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-top: 1.75rem;
        }

        .required-checkbox input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .remove-field-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 2rem;
            height: 2rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1.75rem;
        }

        .remove-field-btn:hover {
            background: #b71c1c;
            transform: scale(1.1);
        }

        .add-field-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .add-field-btn:hover {
            background: #1b3209;
            transform: translateY(-2px);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem 2rem;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        /* Flash messages */
        .flash-messages {
            margin-bottom: 2rem;
        }

        .flash-message {
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            font-weight: 500;
            border-left: 4px solid;
            animation: slideInDown 0.3s ease;
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flash-message.success {
            background: var(--sakura-light);
            color: var(--success-color);
            border-left-color: var(--success-color);
        }

        .flash-message.error {
            background: rgba(211, 47, 47, 0.1);
            color: var(--danger-color);
            border-left-color: var(--danger-color);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .form-card {
                padding: 1.5rem;
            }

            .field-row {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .required-checkbox,
            .remove-field-btn {
                margin-top: 0;
                padding-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">FormCraft</h1>
            <p class="subtitle">Créateur de formulaires dynamiques</p>
            <a href="/" class="back-link">
                <span>←</span>
                <span>Retour à l'accueil</span>
            </a>
        </div>

        <!-- Messages flash -->
        {% if get_flashed_messages() %}
            <div class="flash-messages">
                {% for category, message in get_flashed_messages(with_categories=true) %}
                    <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="form-card">
            <form method="POST" action="/create-form">
                <div class="form-section">
                    <h2 class="section-title">📋 Informations du formulaire</h2>
                    
                    <div class="form-group">
                        <label for="form_name">Nom du formulaire (identifiant unique)</label>
                        <input type="text" id="form_name" name="form_name" 
                               placeholder="ex: contact, inscription, enquete" 
                               pattern="[a-zA-Z0-9_-]+" 
                               title="Seules les lettres, chiffres, tirets et underscores sont autorisés"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="form_title">Titre du formulaire</label>
                        <input type="text" id="form_title" name="form_title" 
                               placeholder="ex: Formulaire de contact" 
                               required>
                    </div>

                    <div class="form-group">
                        <label for="form_description">Description (optionnelle)</label>
                        <textarea id="form_description" name="form_description" 
                                  placeholder="Décrivez brièvement l'objectif de ce formulaire"></textarea>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="section-title">🔧 Configuration des champs</h2>
                    
                    <div class="fields-container">
                        <div id="fields-list">
                            <!-- Premier champ par défaut -->
                            <div class="field-item">
                                <div class="field-row">
                                    <div class="form-group">
                                        <label>Nom du champ</label>
                                        <input type="text" name="field_name[]" 
                                               placeholder="ex: nom, email, message" 
                                               pattern="[a-zA-Z0-9_]+" 
                                               title="Seules les lettres, chiffres et underscores"
                                               required>
                                    </div>
                                    <div class="form-group">
                                        <label>Libellé affiché</label>
                                        <input type="text" name="field_label[]" 
                                               placeholder="ex: Votre nom" 
                                               required>
                                    </div>
                                    <div class="form-group">
                                        <label>Type</label>
                                        <select name="field_type[]" required>
                                            <option value="text">Texte</option>
                                            <option value="email">Email</option>
                                            <option value="number">Nombre</option>
                                            <option value="date">Date</option>
                                            <option value="textarea">Texte long</option>
                                        </select>
                                    </div>
                                    <div class="required-checkbox">
                                        <input type="checkbox" name="field_required[]" value="1">
                                        <label>Requis</label>
                                    </div>
                                    <button type="button" class="remove-field-btn" onclick="removeField(this)">✕</button>
                                </div>
                            </div>
                        </div>
                        
                        <button type="button" class="add-field-btn" onclick="addField()">
                            <span>➕</span>
                            <span>Ajouter un champ</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    🚀 Créer le formulaire
                </button>
            </form>
        </div>
    </div>

    <script>
        function addField() {
            const fieldsList = document.getElementById('fields-list');
            const fieldItem = document.createElement('div');
            fieldItem.className = 'field-item';
            fieldItem.innerHTML = `
                <div class="field-row">
                    <div class="form-group">
                        <label>Nom du champ</label>
                        <input type="text" name="field_name[]" 
                               placeholder="ex: nom, email, message" 
                               pattern="[a-zA-Z0-9_]+" 
                               title="Seules les lettres, chiffres et underscores"
                               required>
                    </div>
                    <div class="form-group">
                        <label>Libellé affiché</label>
                        <input type="text" name="field_label[]" 
                               placeholder="ex: Votre nom" 
                               required>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select name="field_type[]" required>
                            <option value="text">Texte</option>
                            <option value="email">Email</option>
                            <option value="number">Nombre</option>
                            <option value="date">Date</option>
                            <option value="textarea">Texte long</option>
                        </select>
                    </div>
                    <div class="required-checkbox">
                        <input type="checkbox" name="field_required[]" value="1">
                        <label>Requis</label>
                    </div>
                    <button type="button" class="remove-field-btn" onclick="removeField(this)">✕</button>
                </div>
            `;
            
            fieldsList.appendChild(fieldItem);
            
            // Animation d'entrée
            fieldItem.style.opacity = '0';
            fieldItem.style.transform = 'translateY(20px)';
            setTimeout(() => {
                fieldItem.style.transition = 'all 0.3s ease';
                fieldItem.style.opacity = '1';
                fieldItem.style.transform = 'translateY(0)';
            }, 10);
        }

        function removeField(button) {
            const fieldItem = button.closest('.field-item');
            const fieldsList = document.getElementById('fields-list');
            
            // Empêcher la suppression du dernier champ
            if (fieldsList.children.length <= 1) {
                alert('⚠️ Vous devez conserver au moins un champ dans le formulaire.');
                return;
            }
            
            // Animation de sortie
            fieldItem.style.transition = 'all 0.3s ease';
            fieldItem.style.opacity = '0';
            fieldItem.style.transform = 'translateY(-20px)';
            
            setTimeout(() => {
                fieldItem.remove();
            }, 300);
        }

        // Animation au chargement
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.form-card, .field-item');
            elements.forEach((element, index) => {
                element.style.opacity = '0';
                element.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    element.style.transition = 'all 0.6s ease';
                    element.style.opacity = '1';
                    element.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>

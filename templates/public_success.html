<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci ! - FormCraft</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #faf9f7;
            --bg-secondary: #f5f3f0;
            --bg-card: rgba(255, 255, 255, 0.9);
            --accent-primary: #2d5016;
            --accent-secondary: #e91e63;
            --accent-gradient: linear-gradient(135deg, #4a7c59, #e91e63);
            --text-primary: #2c2c2c;
            --text-secondary: #666666;
            --text-muted: #999999;
            --success-color: #4a7c59;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.1);
            --sakura-light: #fce4ec;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(74, 124, 89, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(233, 30, 99, 0.05) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 500px;
            text-align: center;
        }

        .success-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(74, 124, 89, 0.2);
            border-radius: 1.5rem;
            padding: 3rem 2rem;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.8s ease;
        }

        .success-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, var(--success-color), var(--accent-secondary));
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: bounce 1s ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .success-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--success-color);
            margin-bottom: 1rem;
        }

        .success-message {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .form-title {
            font-weight: 600;
            color: var(--accent-primary);
        }

        .footer {
            margin-top: 2rem;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .powered-by {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: var(--sakura-light);
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .powered-by:hover {
            transform: translateY(-2px);
            color: var(--accent-primary);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .success-card {
                padding: 2rem 1.5rem;
            }

            .success-title {
                font-size: 1.5rem;
            }

            .success-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-card">
            <div class="success-icon">✅</div>
            <h1 class="success-title">Merci !</h1>
            <div class="success-message">
                <p>Votre réponse au formulaire <span class="form-title">{{ form_info.title }}</span> a été enregistrée avec succès.</p>
                <p>Nous avons bien reçu vos informations et vous recontacterons si nécessaire.</p>
            </div>
        </div>

        <div class="footer">
            <p>Vous pouvez fermer cette page en toute sécurité.</p>
            <a href="https://formcraft.example.com" class="powered-by" target="_blank">
                <span>⚡</span>
                <span>Powered by FormCraft</span>
            </a>
        </div>
    </div>
</body>
</html>
